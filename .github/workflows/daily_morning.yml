name: 板块提醒-早报（隔夜美股）
on:
  schedule:
    - cron: '0 0 * * 1-6'        # 主班：UTC 00:00 = 北京 08:00，周一~周六
    - cron: '47 0 * * 1-6'       # 兜底班：北京 08:47。GitHub 漏发/严重延迟时补推
  workflow_dispatch:             # 手动触发；勾选 force 可忽略「今日已推」强制重推
    inputs:
      force:
        description: '强制重推（忽略当天已推送标记）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write                # 允许把 data/ 提交回仓库

# 主班与兜底班串行，避免两次同时读不到标记而重复推送。
# 排队中的班次在启动时才 checkout，能读到前一班已提交的推送标记。
concurrency:
  group: daily-morning
  cancel-in-progress: false

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                  # 取启动时最新 main，确保能读到前一班已提交的推送标记
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 首次运行初始化 3 年历史（之后增量，自动跳过）
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
        run: |
          if [ ! -f data/history.json ]; then
            python src/main.py --mode init
          fi

      - name: 生成并推送早报
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
          FORCE_PUSH: ${{ github.event.inputs.force == 'true' && '1' || '' }}
        run: python src/main.py --mode morning

      - name: 提交当日数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/ || true
          if git diff --cached --quiet; then
            echo "无数据变更"
          else
            git commit -m "data: 早报自动更新 $(date +%F)"
            git push
          fi
