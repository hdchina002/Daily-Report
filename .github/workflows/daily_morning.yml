name: 板块提醒-早报（隔夜美股）
on:
  schedule:
    - cron: '0 0 * * 1-6'        # UTC 00:00 = 北京时间 08:00；周一~周六（保留周六报周五收盘，周日无新鲜美股故跳过，省额度）
  workflow_dispatch: {}          # 支持 GitHub 网页手动触发测试

permissions:
  contents: write                # 允许把 data/ 提交回仓库

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 首次运行初始化 3 年历史（之后增量，自动跳过）
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
        run: |
          if [ ! -f data/history.json ]; then
            python src/main.py --mode init
          fi

      - name: 生成并推送早报
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
        run: python src/main.py --mode morning

      - name: 提交当日数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          if git diff --cached --quiet; then
            echo "无数据变更"
          else
            git commit -m "data: 早报自动更新 $(date +%F)"
            git push
          fi
