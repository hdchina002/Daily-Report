name: 板块提醒-晚报（A股/港股+资金面）
on:
  schedule:
    - cron: '30 12 * * *'        # UTC 12:30 = 北京时间 20:30
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  evening:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 首次运行初始化 3 年历史（之后增量，自动跳过）
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
        run: |
          if [ ! -f data/history.json ]; then
            python src/main.py --mode init
          fi

      - name: 生成并推送晚报
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
        run: python src/main.py --mode evening

      - name: 提交当日数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          if git diff --cached --quiet; then
            echo "无数据变更"
          else
            git commit -m "data: 晚报自动更新 $(date +%F)"
            git push
          fi
